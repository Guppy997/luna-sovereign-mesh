kube-prometheus-stack:
  global:
    imagePullSecrets:
      - name: image-pull-secret
    imageRegistry: ""
  prometheusOperator:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 200Mi
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    prometheus:
      monitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  prometheus:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      paths:
        - /prometheus
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net

    prometheusSpec:
      retention: 7d
      retentionSize: 512MB
      resources:
        requests:
          memory: 400Mi
        limits:
          memory: 900Mi
      serviceMonitorSelector:
        matchLabels:
          monitoring.instance: luna-sovereign-mesh-dev
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
      externalUrl: https://raspberrypi-1.tailddc8f7.ts.net:10001/prometheus
      routePrefix: /prometheus
    thanosServiceMonitor:
      serviceMonitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  alertmanager:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      paths:
        - /alertmanager
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net

    # Alert-Routing → ntfy (Push aufs Pixel via Tailnet).
    # Eingeführt nach dem OOM-Incident vom 2026-06-12: Alerts feuerten 8 Tage
    # ins Leere, weil kein Receiver konfiguriert war.
    # Siehe docs/incidents/2026-06-12-argocd-oom-crashloop.md
    config:
      route:
        receiver: ntfy
        group_by: ["namespace", "alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog (Heartbeat) und InfoInhibitor sind Hilfs-Alerts, kein Push
          - receiver: "null"
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
      receivers:
        - name: "null"
        - name: ntfy
          webhook_configs:
            # alertmanager-ntfy-Bridge (Namespace ntfy) übersetzt
            # Alertmanager-Webhooks in ntfy-Pushes auf Topic "luna-alerts"
            - url: http://alertmanager-ntfy.ntfy.svc.cluster.local:8000/hook
              send_resolved: true

