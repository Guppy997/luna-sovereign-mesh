kube-prometheus-stack:
  global:
    imagePullSecrets:
      - name: image-pull-secret
    imageRegistry: ""
  prometheusOperator:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 200Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    prometheus:
      monitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  prometheus:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      paths:
        - /prometheus
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net

    prometheusSpec:
      retention: 1d
      retentionSize: 256MB
      # 30s-Default halbiert: Single-User-Homelab braucht keine 30s-Auflösung,
      # spart CPU + Samples (Pi-Ressourcen)
      scrapeInterval: 60s
      evaluationInterval: 60s
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 512Mi
      serviceMonitorSelector:
        matchLabels:
          monitoring.instance: luna-sovereign-mesh-dev
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
      externalUrl: https://raspberrypi-1.tailddc8f7.ts.net:10001/prometheus
      routePrefix: /prometheus
    thanosServiceMonitor:
      serviceMonitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  alertmanager:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      paths:
        - /alertmanager
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net

    # Alert-Routing → ntfy (Push aufs Pixel via Tailnet).
    # Eingeführt nach dem OOM-Incident vom 2026-06-12: Alerts feuerten 8 Tage
    # ins Leere, weil kein Receiver konfiguriert war.
    # Siehe docs/incidents/2026-06-12-argocd-oom-crashloop.md
    config:
      route:
        receiver: ntfy
        group_by: ["namespace", "alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog (Heartbeat) und InfoInhibitor sind Hilfs-Alerts, kein Push
          - receiver: "null"
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
          # apiserver-Scrape ist bewusst deaktiviert (s. kubeApiServer.enabled
          # oben) — diese Alerts hängen alle an job="apiserver" und sind damit
          # dauerhafte Fehlalarme. KubeAPIDown selbst hängt zusätzlich am
          # kubeApiServer.enabled-Gate und verschwindet dadurch schon aus der Regel;
          # die anderen 5 nicht (nur an defaultRules.rules.kubernetesSystem, s.
          # Kommentar unten) — die Route hier fängt beide Fälle ab (Redundanz für
          # KubeAPIDown ist harmlos). Stummgeschaltet statt per defaultRules.disabled
          # gelöscht: bleiben in Prometheus/Alertmanager sichtbar, pushen nur nicht
          # mehr auf ntfy.
          - receiver: "null"
            matchers:
              - alertname =~ "KubeAPIDown|KubeAPIInstanceUnreachable|KubeAPITerminatedRequests|KubeAggregatedAPIDown|KubeAggregatedAPIErrors|KubeClientCertificateExpiration"
      receivers:
        - name: "null"
        - name: ntfy
          webhook_configs:
            # alertmanager-ntfy-Bridge (Namespace ntfy) übersetzt
            # Alertmanager-Webhooks in ntfy-Pushes auf Topic "luna-alerts"
            - url: http://alertmanager-ntfy.ntfy.svc.cluster.local:8000/hook
              send_resolved: true

# Below is an example alertmanager.config section:
# It demonstrates an advanced routing setup that includes Microsoft Teams (v2), a watchdog receiver
# (e.g. for UptimeRobot) and a silenced route for informational alerts.
# This config use webhook urls from secret-files (see alertmanagerSpec below)
#
#    config:
#      route:
#        receiver: msteams-notifications  # Default receiver if no route matches
#        routes:
#          # 1. Silence all alerts named "InfoInhibitor"
#          - receiver: "null"
#            matchers:
#              - alertname =~ "InfoInhibitor"
#          # 2. Route "Watchdog" alerts to UptimeRobot with a short repeat interval
#          - receiver: uptimerobot
#            repeat_interval: 1m
#            matchers:
#              - alertname =~ "Watchdog"
#          # 3. Route all alerts with severity "warning" or "critical" to Microsoft Teams
#          - receiver: 'msteams-notifications'
#            matchers:
#              - severity =~ "warning|critical"
#            continue: true  # Continue to evaluate other routes after this one
#      receivers:
#        # Microsoft Teams v2 receiver using `msteamsv2_configs`
#        - name: 'msteams-notifications'
#          msteamsv2_configs:
#            - send_resolved: true
#              webhook_url_file: /etc/alertmanager/secrets/msteams-webhook-url
#        # Watchdog/Uptime monitoring receiver
#        - name: uptimerobot
#          webhook_configs:
#            - url_file: /etc/alertmanager/secrets/uptimerobot-webhook-url
#        # Null receiver to discard matched alerts
#        - name: "null"
#      # Optional: Use custom templates for consistent alert formatting
#      templates:
#        - /etc/alertmanager/config/*.tmpl

    alertmanagerSpec:
#      # secrets for alertmanager config webhook urls
#      secrets:
#        - msteams-webhook-url
#        - uptimerobot-webhook-url

      externalUrl: https://raspberrypi-1.tailddc8f7.ts.net:10001/alertmanager
      routePrefix: /alertmanager

  kube-state-metrics:
    prometheus:
      monitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  # ACHTUNG Sub-Chart: prometheus-node-exporter rendert seine ServiceMonitor aus
  # EIGENEN Values (prometheus.monitor.*), das serviceMonitorSelector-Label der
  # Prometheus-CR (monitoring.instance) wird NICHT vom Parent-Chart durchgereicht.
  # Ohne diesen Block existiert die SM, wird aber nie in einen Scrape-Pool
  # aufgenommen → node_*-Metriken fehlen komplett und 26 Alerts können nicht
  # feuern, u.a. PiSwapHigh/PiTemperatureHigh (eigene luna-pi-hardware-Rules) und
  # NodeFilesystemAlmostOutOfSpace. Entdeckt 2026-07-26 beim Setup-Audit: Swap lag
  # bei 57 % (Schwelle 50 %), ohne dass ein Alert kam. Gleiche Fallstrick-Klasse wie
  # bei den Probe-CRs (die brauchen `release`, hier fehlt `monitoring.instance`).
  prometheus-node-exporter:
    prometheus:
      monitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  # k3s läuft als Ein-Prozess-Binary: der kubelet-Endpoint (10250) liefert
  # apiserver/etcd/scheduler/controller-manager-Metriken mit. Die separaten
  # Control-Plane-Scrapes verdoppeln daher nur Serien (2026-07-14: 44k von
  # 137k head series allein der apiserver-Scrape) → deaktiviert. Die
  # kubeApiserver{Availability,Burnrate,Histogram,Slos}-defaultRules gated das
  # Chart selbst mit ab (Template prüft zusätzlich .Values.kubeApiServer.enabled).
  # ABER: templates/prometheus/rules-1.14/kubernetes-system-apiserver.yaml (Alert
  # KubeAPIDown u.a.) hängt NUR an defaultRules.rules.kubernetesSystem, nicht an
  # kubeApiServer.enabled — ohne Gegenmaßnahme feuert KubeAPIDown dauerhaft als
  # Fehlalarm (absent(up{job="apiserver"}) ist ja immer wahr, Job existiert nicht
  # mehr). Entdeckt 2026-07-16: Alert feuerte seit 14.07. alle 12h (repeat_interval).
  # NICHT über defaultRules.disabled lösbar: kubernetesSystem hängt an DREI Dateien
  # (kubernetes-system.yaml + -kubelet.yaml + -apiserver.yaml), einzeln ausschalten
  # bräuchte defaultRules.disabled für ALLE 6 Alerts der apiserver-Datei — dann
  # wird deren rules-Liste leer, und der Chart rendert `rules: null` statt `[]`
  # (Sprig-Listen-Bug, kein `:= list`-Init) → PrometheusRule von k8s abgelehnt
  # ("spec.groups[0].rules ... must be of type array"). Stattdessen unten in der
  # Alertmanager-Route stummgeschaltet (gleiches Muster wie Watchdog/InfoInhibitor).
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  kubelet:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
      # Embedded-Control-Plane-Histogramme aus dem kubelet-Scrape droppen
      # (~45k Serien): Homelab-Dashboards nutzen nur Kubelet/cAdvisor-Metriken.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "(apiserver|etcd|scheduler|workqueue|prober)_.*"
          action: drop
  coreDns:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  kubeDns:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  thanosRuler:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  grafana:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 256Mi
    # Kein eigener env.GOMEMLIMIT mehr (war 192MiB, gesetzt 2026-07-14 gegen
    # RSS-Wachstum auf ~300Mi): Der grafana-Subchart setzt GOMEMLIMIT inzwischen
    # SELBST automatisch aus resources.limits.memory (templates/_pod.tpl, kein
    # Values-Toggle zum Abschalten) — unser eigener Eintrag kam als zweites
    # env-Listenelement mit gleichem Namen dazu. Führte zu
    # "duplicate entries for key [name=\"GOMEMLIMIT\"]" in Argos
    # structured-merge-diff → ComparisonError → App-Sync-Status dauerhaft
    # Unknown für ALLE Resources (entdeckt 2026-07-16 beim KubeAPIDown-Fix).
    service:
      type: ClusterIP
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    serviceMonitor:
      labels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      path: /grafana
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net
    grafana.ini:
      server:
        domain: raspberrypi-1.tailddc8f7.ts.net
        root_url: "https://raspberrypi-1.tailddc8f7.ts.net:10001/grafana/"
        serve_from_sub_path: true
      feature_toggles:
        kubernetesClientDashboardsFolders: false
        unifiedStorageDashboards: false
    additionalDataSources:
      - access: proxy
        isDefault: false
        name: loki
        type: loki
        url: http://loki-headless.loki.svc.cluster.local:3100
        version: 1
prometheus-blackbox-exporter:
  image:
    pullSecrets:
      - image-pull-secret
  global:
    imageRegistry: quay.io
  config:
    modules:
      # Probes Pi-hole on the host: full DNS round-trip, not just a TCP connect.
      # Pi-hole is the single upstream for LAN, tailnet AND cluster DNS since 2026-07-05.
      dns_pihole:
        prober: dns
        timeout: 5s
        dns:
          query_name: github.com
          query_type: A
          transport_protocol: udp
          preferred_ip_protocol: ip4
          valid_rcodes:
            - NOERROR

externalSecrets:
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev

  secretStores:
    luna-sovereign-mesh-dev:
      kind: ClusterSecretStore
      name: luna-sovereign-mesh-dev

  secrets:
    grafana-admin-credentials:
      secretStoreRef: luna-sovereign-mesh-dev
      dataFrom:
        - remoteKey: grafana-credentials

namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
