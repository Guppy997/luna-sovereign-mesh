#      route:
#        receiver: msteams-notifications  # Default receiver if no route matches
#        routes:
#          # 1. Silence all alerts named "InfoInhibitor"
#          - receiver: "null"
#            matchers:
#              - alertname =~ "InfoInhibitor"
#          # 2. Route "Watchdog" alerts to UptimeRobot with a short repeat interval
#          - receiver: uptimerobot
#            repeat_interval: 1m
#            matchers:
#              - alertname =~ "Watchdog"
#          # 3. Route all alerts with severity "warning" or "critical" to Microsoft Teams
#          - receiver: 'msteams-notifications'
#            matchers:
#              - severity =~ "warning|critical"
#            continue: true  # Continue to evaluate other routes after this one
#      receivers:
#        # Microsoft Teams v2 receiver using `msteamsv2_configs`
#        - name: 'msteams-notifications'
#          msteamsv2_configs:
#            - send_resolved: true
#              webhook_url_file: /etc/alertmanager/secrets/msteams-webhook-url
#        # Watchdog/Uptime monitoring receiver
#        - name: uptimerobot
#          webhook_configs:
#            - url_file: /etc/alertmanager/secrets/uptimerobot-webhook-url
#        # Null receiver to discard matched alerts
#        - name: "null"
#      # Optional: Use custom templates for consistent alert formatting
#      templates:
#        - /etc/alertmanager/config/*.tmpl

    alertmanagerSpec:
#      # secrets for alertmanager config webhook urls
#      secrets:
#        - msteams-webhook-url
#        - uptimerobot-webhook-url

      externalUrl: https://raspberrypi-1.tailddc8f7.ts.net:10001/alertmanager
      routePrefix: /alertmanager

  kube-state-metrics:
    prometheus:
      monitor:
        additionalLabels:
          monitoring.instance: luna-sovereign-mesh-dev
  kubeApiServer:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  kubelet:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  kubeControllerManager:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  coreDns:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  kubeDns:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  kubeScheduler:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  thanosRuler:
    serviceMonitor:
      additionalLabels:
        monitoring.instance: luna-sovereign-mesh-dev
  grafana:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 256Mi
    service:
      type: ClusterIP
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    serviceMonitor:
      labels:
        monitoring.instance: luna-sovereign-mesh-dev
    ingress:
      enabled: true
      ingressClassName: traefik
      path: /grafana
      pathType: Prefix
      hosts:
        - raspberrypi-1.tailddc8f7.ts.net
    grafana.ini:
      server:
        domain: raspberrypi-1.tailddc8f7.ts.net
        root_url: "https://raspberrypi-1.tailddc8f7.ts.net:10001/grafana/"
        serve_from_sub_path: true
      feature_toggles:
        kubernetesClientDashboardsFolders: false
        unifiedStorageDashboards: false
    additionalDataSources:
      - access: proxy
        isDefault: false
        name: loki
        type: loki
        url: http://loki-headless.loki.svc.cluster.local:3100
        version: 1
prometheus-blackbox-exporter:
  image:
    pullSecrets:
      - image-pull-secret
  global:
    imageRegistry: quay.io

externalSecrets:
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev

  secretStores:
    luna-sovereign-mesh-dev:
      kind: ClusterSecretStore
      name: luna-sovereign-mesh-dev

  secrets:
    grafana-admin-credentials:
      secretStoreRef: luna-sovereign-mesh-dev
      dataFrom:
        - remoteKey: grafana-credentials

namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
