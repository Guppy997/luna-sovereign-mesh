namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"


externalSecrets:
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev

  secretStores:
    luna-sovereign-mesh-dev:
      kind: ClusterSecretStore
      name: luna-sovereign-mesh-dev

  secrets:
    oauth2-credentials:
      secretStoreRef: luna-sovereign-mesh-dev
      dataFrom:
        - remoteKey: oauth2_credentials


oauth2-proxy:
  imagePullSecrets:
    - name: image-pull-secret
  config:
    existingSecret: oauth2-credentials
    configFile: |-
      reverse_proxy = true
      redirect_url = "https://luna-sovereign-mesh-dev.luna.local/oauth2/callback"
      email_domains = [ "*" ]
      cookie_secure = true
      upstreams = [ "static://200" ]
      github_org = "Guppy997"
      github_team = "luna-team"
      provider = "github"
      scope = "read:user user:email read:org"
  ingress:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    enabled: true
    path: /oauth2
    pathType: Prefix
    hosts:
      - luna-sovereign-mesh-dev.luna.local
    tls:
      - secretName: tls-oauth2-proxy
        hosts:
          - luna-sovereign-mesh-dev.luna.local
  metrics:
    serviceMonitor:
      enabled: true
      labels:
        monitoring.instance: "luna-sovereign-mesh-dev"


