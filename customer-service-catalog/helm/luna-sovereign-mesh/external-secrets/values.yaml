clusterSecretStores:
  luna-sovereign-mesh-dev:
    name: luna-sovereign-mesh-dev
    provider:
      kubernetes:
        remoteNamespace: external-secrets
        server:
          url: https://kubernetes.default.svc
          caProvider:
            type: ConfigMap
            name: kube-root-ca.crt
            namespace: kube-system
            key: ca.crt
        auth:
          serviceAccount:
            name: external-secrets
            namespace: external-secrets
namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
external-secrets:
  certController:
    imagePullSecrets:
      - name: image-pull-secret
  webhook:
    imagePullSecrets:
      - name: image-pull-secret
  imagePullSecrets:
    - name: image-pull-secret
  serviceMonitor:
    enabled: true
    additionalLabels:
      monitoring.instance: "luna-sovereign-mesh-dev"
  bitwarden-sdk-server:
    enabled: false
