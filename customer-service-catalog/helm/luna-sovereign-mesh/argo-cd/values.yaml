bootstrapValues:
  dockerPullSecrets:
    image-pull-secret:
      name: image-pull-secret
      matchNamespaceLabels:
        project-name: "luna-sovereign-mesh"
        stage: "dev"
      secretStoreRef:
        kind: ClusterSecretStore
        name: "luna-sovereign-mesh-dev"
      remoteRef:
        remoteKey: docker-config
        remoteKeyProperty: pull-secret
  projects:
    luna-sovereign-mesh-dev:
      name: "luna-sovereign-mesh-dev"
      namespace: argocd
      description: "luna-sovereign-mesh-dev project"
      orphanedResources:
        warn: false
        ignore:
          - kind: Secret
            name: cert-manager-webhook-ca

  applicationSets:
    luna-sovereign-mesh-dev:
      projectName: "luna-sovereign-mesh-dev"
      managedServices:
        repoURL: "https://github.com/Guppy997/luna-sovereign-mesh.git"
        path: "managed-service-catalog/helm"
        targetRevision: "main"
      customerServices:
        repoURL: "https://github.com/Guppy997/luna-sovereign-mesh.git"
        path: "customer-service-catalog/helm"
        targetRevision: "main"
      apps:
        argocd:
          name: argocd
          path: argo-cd
        cert-manager:
          name: cert-manager
          path: cert-manager
        external-dns:
          name: external-dns
          path: external-dns
        external-secrets:
          name: external-secrets
          path: external-secrets
        homer-dashboard:
          name: homer-dashboard
          path: homer-dashboard
        kube-prometheus-stack:
          name: kube-prometheus-stack
          path: kube-prometheus-stack
        kyverno:
          name: kyverno
          path: kyverno
        kyverno-policies:
          name: kyverno-policies
          path: kyverno-policies
        kyverno-policy-reporter:
          name: kyverno-policy-reporter
          path: kyverno-policy-reporter
        loki:
          name: loki
          path: loki
        longhorn:
          name: longhorn
          path: longhorn
        metallb:
          name: metallb
          path: metallb
        metrics-server:
          name: metrics-server
          path: metrics-server
        oauth2-proxy:
          name: oauth2-proxy
          path: oauth2-proxy
        traefik:
          name: traefik
          path: traefik


namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
inClusterName: luna-sovereign-mesh
inClusterSecretLabels:
## Hub labels
  argocd: "disabled"
  cert-manager: "enabled"
  external-dns: "disabled"
  external-secrets: "enabled"
  homer-dashboard: "enabled"
  kube-prometheus-stack: "enabled"
  kyverno: "enabled"
  kyverno-policies: "enabled"
  kyverno-policy-reporter: "enabled"
  loki: "enabled"
  longhorn: "disabled"
  metallb: "disabled"
  metrics-server: "disabled"
  oauth2-proxy: "disabled"
  traefik: "enabled"

externalSecrets:
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev

  secretStores:
    luna-sovereign-mesh-dev:
      kind: ClusterSecretStore
      name: luna-sovereign-mesh-dev

argo-cd:
  server:
    ingressGrpc:
      enabled: true
      path: "/argocd"
      ingressClassName: traefik
      tls: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
    ingress:
      path: "/argocd"
      ingressClassName: traefik
      tls: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
  configs:
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, Guppy997:luna-team, role:admin
    params:
      server.rootpath: /argocd
      server.basehref: /argocd
      server.insecure: true
  global:
    domain: luna-sovereign-mesh-dev.luna.local
    revisionHistoryLimit: 5
    imagePullSecrets:
      - name: image-pull-secret
  controller:
    metrics:
      enabled: true
      rules:
        enabled: false
      serviceMonitor:
        enabled: true
        additionalLabels:
          monitoring.instance: "luna-sovereign-mesh-dev"
