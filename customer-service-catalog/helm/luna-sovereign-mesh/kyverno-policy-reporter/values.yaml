namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
policy-reporter:
  imagePullSecrets:
    - name: image-pull-secret
  replicaCount: 1
  metrics:
    enabled: true
  monitoring:
    serviceMonitor:
      labels:
        monitoring.instance: "luna-sovereign-mesh-dev"
  ui:
    enabled: true
    ingress:
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: luna-sovereign-mesh-dev.luna.local
          paths:
            - path: "/kyverno"
              pathType: Prefix
      tls:
        - secretName: tls-kyverno-ui
          hosts:
            - luna-sovereign-mesh-dev.luna.local

