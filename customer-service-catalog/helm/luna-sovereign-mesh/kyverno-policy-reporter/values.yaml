namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
policy-reporter:
  imagePullSecrets:
    - name: image-pull-secret
  replicaCount: 1
  metrics:
    enabled: true
  monitoring:
    serviceMonitor:
      labels:
        monitoring.instance: "luna-sovereign-mesh-dev"
  ui:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: raspberrypi-1.tailddc8f7.ts.net
          paths:
            - path: "/policy-reporter"
              pathType: Prefix

