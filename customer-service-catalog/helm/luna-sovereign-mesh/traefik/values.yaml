traefik:
  deployment:
    imagePullSecrets:
      - name: image-pull-secret
  api:
    dashboard: true
  ingressRoute:
    dashboard:
      enabled: false
  metrics:
    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels:
          monitoring.instance: "luna-sovereign-mesh-dev"

namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
