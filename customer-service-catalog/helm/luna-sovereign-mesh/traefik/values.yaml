traefik:
  deployment:
    imagePullSecrets:
      - name: image-pull-secret
  # Tailscale terminates TLS and forwards HTTP with X-Forwarded-Proto: https.
  # Without this, Traefik overwrites the header and apps behind it can't detect HTTPS.
  additionalArguments:
    - "--entrypoints.web.forwardedHeaders.insecure"
  service:
    spec:
      # NodePorts schließen — Zugriff nur über LB-IP (LAN-seitig durch
      # loadBalancerSourceRanges blockiert) und Tailscale Serve (ClusterIP)
      allocateLoadBalancerNodePorts: false
      loadBalancerSourceRanges:
        - 100.64.0.0/10 # nur Tailnet
  api:
    dashboard: true
  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`raspberrypi-1.tailddc8f7.ts.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/rawdata`) || PathPrefix(`/api/overview`) || PathPrefix(`/api/version`) || PathPrefix(`/api/http`) || PathPrefix(`/api/tcp`) || PathPrefix(`/api/udp`) || PathPrefix(`/api/entrypoints`) || PathPrefix(`/api/cache`) || PathPrefix(`/api/debug`))
      entryPoints:
        - web
  ports:
    webAppflowy:
      port: 10005
      expose:
        default: false
      protocol: TCP
  metrics:
    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels:
          monitoring.instance: "luna-sovereign-mesh-dev"

namespace:
  labels:
    project-name: "luna-sovereign-mesh"
    stage: "dev"
