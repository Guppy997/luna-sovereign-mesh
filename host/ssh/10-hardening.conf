# SSH nur mit Schlüssel, kein root-Login. Bisher kam das nur aus der
# 50-cloud-init.conf des Raspberry Pi Imagers; hier steht es im Repo, damit ein
# Neuaufbau nicht davon abhängt. sshd nimmt pro Option den ersten Wert, deshalb 10-.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
