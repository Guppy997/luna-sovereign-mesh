server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: yes
    prefer-ip6: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232

    # Cache: 64 MB msg + 128 MB rrset (statt default 4 MB je)
    # Reduziert rekursive Lookups drastisch -> weniger Queue-Overflows
    msg-cache-size: 64m
    rrset-cache-size: 128m
    neg-cache-size: 8m

    # Veraltete Eintraege sofort ausliefern, frische Antwort im Hintergrund holen
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30

    # Mindest-TTL 5 Minuten: haeufige Domains bleiben laenger im Cache
    cache-min-ttl: 300

    # Prefetch kurz vor Ablauf
    prefetch: yes
    prefetch-key: yes

    # Pi 5 hat 4 Kerne - 2 Threads fuer DNS-Spitzenlast
    num-threads: 2
    so-rcvbuf: 4m

    # Mehr gleichzeitige Anfragen pro Thread
    num-queries-per-thread: 4096
    outgoing-range: 4096

    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
    root-hints: "/var/lib/unbound/root.hints"
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
