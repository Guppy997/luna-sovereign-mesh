version: v1alpha1
clusters:
  - name: luna-sovereign-mesh
    stage: dev
    type: hub
    dnsName: luna-sovereign-mesh-dev.luna.local
    ssoOrg: Guppy997
    ssoTeam: luna-team
    ingressClassName: traefik
    terraform:
      provider: local
      projectId: luna-dev
      kubernetesType: edge
      kubernetesVersion: "1.35"
      dns:
        name: luna-sovereign-mesh-dev.luna.local
        email: 193275228+Guppy997@users.noreply.github.com
    argocd:
      repo:
        https:
          customer:
            url: https://github.com/Guppy997/luna-sovereign-mesh.git
            targetRevision: main
          managed:
            url: https://github.com/Guppy997/luna-sovereign-mesh.git
            targetRevision: main
    services:
      argocd:
        status: disabled
      cert-manager:
        status: enabled
        config:
          clusterIssuer:
            email: yourname@your-domain.de
            name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
      external-dns:
        status: disabled
      external-secrets:
        status: enabled
      homer-dashboard:
        status: disabled
      kube-prometheus-stack:
        status: enabled
      kyverno:
        status: enabled
      kyverno-policies:
        status: enabled
      kyverno-policy-reporter:
        status: enabled
      loki:
        status: enabled
      longhorn:
        status: disabled
      metallb:
        status: disabled
      metrics-server:
        status: disabled
      oauth2-proxy:
        status: disabled
      traefik:
        status: enabled
