name: Idea
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Does it fit the concept?
      description: Single node, GitOps only, nothing exposed outside the tailnet, no plaintext secrets in Git. See docs/security.md.
    validations:
      required: true
