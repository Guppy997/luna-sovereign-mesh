creation_rules:
  # Encrypt all secret files under clusters/*/secrets/
  # Zwei Empfänger: der SOPS-Key des Pi und der Recovery-Key (Privatteil offline,
  # derselbe, an den host/backup.sh die Backups verschlüsselt). So lassen sich
  # die Secrets auch ohne den Pi-Key entschlüsseln.
  - path_regex: clusters/.*/secrets/.*\.(yaml|yml|json)$
    encrypted_regex: ^(data|stringData)$
    age: age1dsnr0ejf7acutf5cqa9nj22a6ga7pdu8ph9dw5ymwnerx2t63uas56sua9,age16ggvcgzy0n6mkdgx2x9rmqmfe8r8gjjgshknkxdv6df9h4c73das7vcwhp
