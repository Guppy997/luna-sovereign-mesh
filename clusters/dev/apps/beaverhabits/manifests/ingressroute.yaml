apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beaverhabits
  namespace: beaverhabits
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10009`)
      kind: Rule
      services:
        - name: beaverhabits
          port: 8080
          passHostHeader: false
