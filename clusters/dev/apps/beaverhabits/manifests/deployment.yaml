apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beaverhabits-data
  namespace: beaverhabits
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: beaverhabits
  namespace: beaverhabits
spec:
  selector:
    app: beaverhabits
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beaverhabits
  namespace: beaverhabits
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beaverhabits
  template:
    metadata:
      labels:
        app: beaverhabits
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beaverhabits
          image: daya0576/beaverhabits:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HABITS_STORAGE
              value: "DATABASE"
            - name: ENABLE_IOS_STANDALONE
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/.user
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beaverhabits-data
        - name: tmp
          emptyDir: {}
