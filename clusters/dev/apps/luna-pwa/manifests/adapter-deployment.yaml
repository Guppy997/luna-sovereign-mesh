apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna-adapter
  namespace: luna-pwa
  labels:
    app.kubernetes.io/name: luna-adapter
    app.kubernetes.io/part-of: luna-pwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: luna-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: luna-adapter
        app.kubernetes.io/part-of: luna-pwa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # 'node'-User im node:20-alpine-Image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          # Lokal gebautes ARM64-Image (in containerd importiert) -> kein Registry-Pull
          image: luna-adapter:v0.1.11
          imagePullPolicy: Never
          env:
            - name: OPENCLAW_WS
              value: "ws://100.87.126.56:18789"
            - name: DEVICE_KEY_FILE
              value: /secrets/device-ed25519.pem
            - name: GATEWAY_TOKEN_FILE
              value: /secrets/gateway-token
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        # Manuell angelegtes Secret (NICHT in git) — wie die anderen Master-Secrets im Projekt
        - name: secrets
          secret:
            secretName: luna-adapter-secrets
