apiVersion: v1
kind: ConfigMap
metadata:
  name: luna-pwa-ts-serve-config
  namespace: luna-pwa
  labels:
    app.kubernetes.io/name: luna-pwa
    app.kubernetes.io/part-of: luna-pwa
data:
  serve.json: |
    {
      "TCP": {
        "443": { "HTTPS": true }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": { "Proxy": "http://127.0.0.1:8080" }
          }
        }
      }
    }
