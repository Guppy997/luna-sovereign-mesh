apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna-pwa
  namespace: luna-pwa
  labels:
    app.kubernetes.io/name: luna-pwa
    app.kubernetes.io/part-of: luna-pwa
spec:
  replicas: 1
  # Recreate statt RollingUpdate: beim Rolling-Overlap registriert sich der
  # neue ts-Sidecar parallel zum alten und bekommt "luna-pwa-1" statt
  # "luna-pwa" — alter Pod muss erst weg, bevor der neue startet
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: luna-pwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: luna-pwa
        app.kubernetes.io/part-of: luna-pwa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # 'nginx'-User im nginx:alpine-Image
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pwa
          # Lokal gebautes ARM64-Image (nginx, statische SPA + /api-Proxy zum Adapter)
          image: luna-pwa:v0.1.41
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # nginx-unprivileged schreibt pid + temp nach /tmp -> bei ROFs beschreibbar machen
            - name: tmp
              mountPath: /tmp

        # Eigener Tailscale-Knoten nur für diese App — bekommt einen eigenen
        # Hostnamen im Tailnet (luna-pwa.<tailnet>.ts.net) statt sich den
        # Pi-Hostnamen + Port mit den anderen PWAs zu teilen. Grund: Android
        # WebAPKs assoziieren sich teils nur über den Hostnamen (ohne Port)
        # mit einer Seite — mehrere PWAs auf demselben Host+verschiedenen
        # Ports kollidieren dadurch beim Installieren ("Open in <andere App>").
        # TS_USERSPACE=true: reines Userspace-Networking, kein /dev/net/tun,
        # kein NET_ADMIN nötig — läuft mit dem Rest des Pods unter Kyverno
        # Enforce (RO-rootfs, non-root, capabilities drop ALL).
        - name: ts-luna
          image: tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: luna-pwa-ts-authkey
                  key: authkey
            - name: TS_HOSTNAME
              value: luna-pwa
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            # Ohne das versucht containerboot, den Status in einem
            # k8s-Secret zu speichern (Standardverhalten sobald es sich
            # selbst als in-Kubernetes-laufend erkennt) — bräuchte dafür
            # RBAC-Rechte auf Secrets. Leerer Wert = einfach die
            # gemountete emptyDir (TS_STATE_DIR) nutzen, kein RBAC nötig.
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
            - name: TS_USERSPACE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:pwa-sidecar
            # containerboot-eigener /healthz-Endpoint (Port 9002) — Basis für
            # die Probes unten (Kyverno require-pod-probes gilt für ALLE Container)
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
          securityContext:
            # containerboot chmod't sein State-Verzeichnis selbst — das
            # gehört root:root (auch beim local-path-PVC unten), ohne
            # Root-User (bzw. CAP_FOWNER) schlägt das fehl und tailscaled
            # startet mit "unhealthy state store". Pod-weites
            # runAsNonRoot/runAsUser 101 (für den nginx-Container gedacht)
            # hier bewusst für diesen einen Container überschrieben.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
            # Tailscale-Login + Serve-Setup brauchen einen Moment
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9002
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: ts-state
              mountPath: /var/lib/tailscale
            - name: ts-config
              mountPath: /config
              readOnly: true
            - name: ts-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ts-state
          persistentVolumeClaim:
            claimName: luna-pwa-ts-state
        - name: ts-tmp
          emptyDir: {}
        - name: ts-config
          configMap:
            name: luna-pwa-ts-serve-config
