apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  namespace: ntfy
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
    app.kubernetes.io/part-of: alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy
        app.kubernetes.io/part-of: alerting
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1
          args: ["--configs", "/etc/alertmanager-ntfy/config.yml"]
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["/bin/alertmanager-ntfy", "--health-check"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/alertmanager-ntfy", "--health-check"]
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-ntfy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alertmanager-ntfy-config
