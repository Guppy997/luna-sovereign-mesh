apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-ntfy-config
  namespace: ntfy
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
    app.kubernetes.io/part-of: alerting
data:
  config.yml: |
    http:
      addr: :8000
    ntfy:
      baseurl: http://ntfy.ntfy.svc.cluster.local
      notification:
        topic: luna-alerts
        priority: |
          status == "firing" ? "urgent" : "default"
        tags:
          - tag: white_check_mark
            condition: status == "resolved"
          - tag: rotating_light
            condition: status == "firing"
        templates:
          title: |
            {{ if eq .Status "resolved" }}Behoben: {{ end }}{{ with index .Annotations "summary" }}{{ . }}{{ else }}{{ index .Labels "alertname" }}{{ end }}
          description: |
            {{ with index .Annotations "description" }}{{ . }}{{ else }}{{ index .Annotations "message" }}{{ end }}
      async: false
