apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: luna-sovereign-mesh-homepage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: luna-sovereign-mesh-dev
  sources:
    - repoURL: https://jameswynn.github.io/helm-charts
      chart: homepage
      targetRevision: 2.1.0
      helm:
        releaseName: homepage
        valueFiles:
          - $valuesRepo/clusters/dev/apps/homepage/values.yaml
    - repoURL: https://github.com/Guppy997/luna-sovereign-mesh.git
      targetRevision: main
      ref: valuesRepo
  destination:
    name: luna-sovereign-mesh
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
