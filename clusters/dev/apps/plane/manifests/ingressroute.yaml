apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-stripprefix-uploads
  namespace: plane
spec:
  stripPrefix:
    prefixes:
      - /uploads
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane
  namespace: plane
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && (PathPrefix(`/api/`) || PathPrefix(`/auth/`) || PathPrefix(`/uploads/`))
      kind: Rule
      priority: 300
      services:
        - name: plane-api
          port: 8000
          passHostHeader: false
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && PathPrefix(`/spaces/`)
      kind: Rule
      priority: 200
      services:
        - name: plane-space
          port: 3000
          passHostHeader: false
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && PathPrefix(`/god-mode/`)
      kind: Rule
      priority: 150
      services:
        - name: plane-admin
          port: 3000
          passHostHeader: false
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && PathPrefix(`/`)
      kind: Rule
      priority: 100
      services:
        - name: plane-web
          port: 3000
          passHostHeader: false
