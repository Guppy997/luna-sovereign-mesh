apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-worker
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-worker
  template:
    metadata:
      labels:
        app: plane-worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plane-worker
          image: makeplane/plane-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              python manage.py wait_for_db
              python manage.py wait_for_migrations
              celery -A plane worker -l info --concurrency=1
          envFrom:
            - configMapRef:
                name: plane-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: secret-key
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: minio-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: minio-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /code/plane/logs
            - name: run
              mountPath: /run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-beat
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-beat
  template:
    metadata:
      labels:
        app: plane-beat
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plane-beat
          image: makeplane/plane-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              python manage.py wait_for_db
              python manage.py wait_for_migrations
              celery -A plane beat -l info -s /tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: plane-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: secret-key
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: minio-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secrets
                  key: minio-secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /code/plane/logs
            - name: run
              mountPath: /run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: run
          emptyDir: {}
