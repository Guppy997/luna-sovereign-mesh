apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-secrets-es
  namespace: plane
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev
  target:
    name: plane-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: plane-secrets
