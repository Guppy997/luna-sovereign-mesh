apiVersion: v1
kind: Service
metadata:
  name: plane-web
  namespace: plane
spec:
  selector:
    app: plane-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-web
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-web
  template:
    metadata:
      labels:
        app: plane-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plane-web
          image: makeplane/plane-frontend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/web/server.js"]
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://raspberrypi-1.tailddc8f7.ts.net:10005"
            - name: NEXT_PUBLIC_WEB_BASE_URL
              value: "https://raspberrypi-1.tailddc8f7.ts.net:10005"
            - name: NEXT_PUBLIC_SPACE_BASE_URL
              value: "https://raspberrypi-1.tailddc8f7.ts.net:10005"
            - name: NEXT_PUBLIC_SPACE_BASE_PATH
              value: "/spaces"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: web-cache
              mountPath: /app/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: web-cache
          emptyDir: {}
---
