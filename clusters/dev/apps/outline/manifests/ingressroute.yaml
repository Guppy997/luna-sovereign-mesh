apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outline
  namespace: outline
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10007`)
      kind: Rule
      priority: 100
      services:
        - name: outline
          port: 3000
          passHostHeader: false
