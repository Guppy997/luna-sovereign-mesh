apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: outline-https-header
  namespace: outline
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: outline
  namespace: outline
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10007`)
      kind: Rule
      priority: 100
      middlewares:
        - name: outline-https-header
      services:
        - name: outline
          port: 3000
          passHostHeader: false
