apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10006`)
      kind: Rule
      priority: 100
      services:
        - name: vaultwarden
          port: 80
          passHostHeader: false
