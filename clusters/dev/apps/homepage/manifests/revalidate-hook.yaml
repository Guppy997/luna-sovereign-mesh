apiVersion: batch/v1
kind: Job
metadata:
  name: homepage-revalidate
  namespace: homepage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: revalidate
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://homepage.homepage.svc.cluster.local:3000/api/healthcheck 2>/dev/null; do
                sleep 2
              done
              wget -qO- http://homepage.homepage.svc.cluster.local:3000/api/revalidate
