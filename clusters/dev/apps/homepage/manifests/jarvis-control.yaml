# Jarvis-Control: Mini-Button-Leiste (Start/Stop KI-Server) fürs Homepage-iframe-Widget.
# Spricht die Home-Assistant-API (switch.ki_server, WoL + SSH-Poweroff) mit dem Token
# aus dem Secret homeassistant-token — der Token verlässt den Cluster nie.
# ACHTUNG: manifests/ wird von Argo NICHT gesynct (verlorene Directory-Source,
# siehe README/Memory) → Änderungen hier manuell `kubectl apply -f` + Pod-Restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-control-app
  namespace: homepage
  labels:
    app.kubernetes.io/name: jarvis-control
data:
  server.mjs: |
    import http from 'node:http';

    const HA = process.env.HA_URL ?? 'http://192.168.178.117:8123';
    const TOKEN = process.env.HASS_TOKEN;
    const ENTITY = process.env.ENTITY_ID ?? 'switch.ki_server';
    const headers = { Authorization: `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

    async function ha(path, method = 'GET', body) {
      const res = await fetch(`${HA}${path}`, { method, headers, body: body && JSON.stringify(body) });
      if (!res.ok) throw new Error(`HA ${res.status}`);
      return res.json();
    }

    const page = `<!doctype html><html lang="de"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      body{margin:0;font-family:system-ui,sans-serif;color:#e2e8f0;background:transparent;
           display:flex;align-items:center;justify-content:center;height:100vh}
      .row{display:flex;gap:.55rem;align-items:center}
      .dot{width:.6rem;height:.6rem;border-radius:50%;background:#64748b;flex:none}
      .on .dot{background:#22c55e;box-shadow:0 0 6px #22c55e}
      .off .dot{background:#ef4444}
      #st{font-size:.8rem;min-width:5.2rem}
      button{border:1px solid #334155;background:#1e293bcc;color:#e2e8f0;border-radius:.5rem;
             padding:.35rem .75rem;cursor:pointer;font-size:.8rem}
      button:hover:enabled{background:#334155}
      button:disabled{opacity:.35;cursor:default}
    </style></head><body>
    <div class="row" id="wrap"><span class="dot"></span><span id="st">…</span>
    <button id="on">Start</button><button id="off">Stoppen</button></div>
    <script>
      const st = document.getElementById('st'), wrap = document.getElementById('wrap');
      const bOn = document.getElementById('on'), bOff = document.getElementById('off');
      let busy = false;
      async function refresh() {
        try {
          const d = await (await fetch('api/state')).json();
          wrap.className = 'row ' + d.state;
          st.textContent = d.state === 'on' ? 'läuft' : d.state === 'off' ? 'aus' : d.state;
          if (!busy) { bOn.disabled = d.state === 'on'; bOff.disabled = d.state !== 'on'; }
        } catch (e) { st.textContent = 'Fehler'; }
      }
      async function turn(dir) {
        busy = true; bOn.disabled = bOff.disabled = true;
        st.textContent = dir === 'on' ? 'startet…' : 'fährt runter…';
        try { await fetch('api/turn?dir=' + dir, { method: 'POST' }); } catch (e) {}
        setTimeout(() => { busy = false; refresh(); }, dir === 'on' ? 25000 : 20000);
      }
      bOn.onclick = () => turn('on');
      bOff.onclick = () => turn('off');
      refresh(); setInterval(refresh, 5000);
    </script></body></html>`;

    http.createServer(async (req, res) => {
      try {
        const url = new URL(req.url, 'http://local');
        if (url.pathname.endsWith('/healthz')) { res.end('ok'); return; }
        if (url.pathname.endsWith('/api/state')) {
          const s = await ha(`/api/states/${ENTITY}`);
          res.setHeader('content-type', 'application/json');
          res.end(JSON.stringify({ state: s.state })); return;
        }
        if (url.pathname.endsWith('/api/turn') && req.method === 'POST') {
          const dir = url.searchParams.get('dir') === 'on' ? 'turn_on' : 'turn_off';
          await ha(`/api/services/switch/${dir}`, 'POST', { entity_id: ENTITY });
          res.setHeader('content-type', 'application/json');
          res.end('{"ok":true}'); return;
        }
        res.setHeader('content-type', 'text/html; charset=utf-8');
        res.end(page);
      } catch (e) {
        res.statusCode = 502;
        res.setHeader('content-type', 'application/json');
        res.end(JSON.stringify({ error: String(e) }));
      }
    }).listen(8080);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-control
  namespace: homepage
  labels:
    app.kubernetes.io/name: jarvis-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jarvis-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jarvis-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jarvis-control
          image: node:24-alpine
          command: ["node", "/app/server.mjs"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homeassistant-token
                  key: token
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: app
          configMap:
            name: jarvis-control-app
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-control
  namespace: homepage
  labels:
    app.kubernetes.io/name: jarvis-control
spec:
  selector:
    app.kubernetes.io/name: jarvis-control
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-control
  namespace: homepage
  labels:
    app.kubernetes.io/name: jarvis-control
spec:
  ingressClassName: traefik
  rules:
    - host: raspberrypi-1.tailddc8f7.ts.net
      http:
        paths:
          - path: /jarvis
            pathType: Prefix
            backend:
              service:
                name: jarvis-control
                port:
                  name: http
