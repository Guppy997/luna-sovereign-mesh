apiVersion: v1
kind: Service
metadata:
  name: homepage-wallpanel
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/component: wallpanel
spec:
  # Gepinnt: Tailscale Serve :10012 proxyt auf diese IP (direkt, ohne Traefik).
  # Eigener Eingang fürs Wand-Tablet (tag:wallpanel): Über Traefik (:10001)
  # wären auch ArgoCD, Grafana, Prometheus usw. erreichbar.
  clusterIP: 10.43.100.12
  selector:
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 3000
      targetPort: 3000
