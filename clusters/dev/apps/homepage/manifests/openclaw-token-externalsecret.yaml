apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-dashboard-token-es
  namespace: homepage
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev
  target:
    name: openclaw-dashboard-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: openclaw-dashboard-token
