enableRbac: true

serviceAccount:
  name: homepage
  create: true

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: luna-sovereign-mesh-dev.luna.local
        paths:
          - path: /
            pathType: Prefix
      - host: raspberrypi-1.tailddc8f7.ts.net
        paths:
          - path: /
            pathType: Prefix

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "luna-sovereign-mesh-dev.luna.local,raspberrypi-1.tailddc8f7.ts.net,raspberrypi-1.tailddc8f7.ts.net:10001,raspberrypi-1.tailddc8f7.ts.net:10009,192.168.178.117,localhost,localhost:3000,homepage,homepage:3000,homepage.homepage.svc.cluster.local,homepage.homepage.svc.cluster.local:3000"
  # OpenClaw-Gateway-Token für den Dashboard-Link (#token=). Kommt aus dem
  # ExternalSecret openclaw-dashboard-token-es → Secret openclaw-dashboard-token
  # (Master-Secret liegt manuell in der external-secrets-ns, NICHT in Git).
  - name: HOMEPAGE_VAR_OPENCLAW_TOKEN
    valueFrom:
      secretKeyRef:
        name: openclaw-dashboard-token
        key: token
  - name: HOMEPAGE_VAR_BESZEL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: beszel-homepage-credentials
        key: password

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs
  # Next.js braucht einen beschreibbaren Cache trotz read-only root-fs
  cache:
    enabled: true
    type: emptyDir
    mountPath: /app/.next/cache

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

config:
  settingsString: |
    title: Luna Sovereign Mesh
    headerStyle: boxed
    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 30
    cardBlur: sm
    theme: dark
    color: slate
    layout:
      Anwendungen:
        style: row
        columns: 4
      Infrastruktur:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 4

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "raspberry pi"
        nodes:
          show: false
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
        cputemp: true
    - search:
        provider: duckduckgo
        target: _blank

  kubernetes:
    mode: cluster

  services:
    - Anwendungen:
        - Beaver Habits:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10009
            description: Habit Tracker (täglich, PWA)
            icon: mdi-check-circle-outline-#22c55e
            namespace: beaverhabits
            app: beaverhabits
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10009
        - Luna Dashboard:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10004
            description: KI-Mitarbeiterin (OpenClaw)
            icon: mdi-robot-#7c3aed
            namespace: luna-pwa
            app: luna-pwa
        - Plane:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10005
            description: Projektmanagement (Jira-Alternative)
            icon: mdi-chart-timeline-variant-#1f2d3d
            namespace: plane
            app: plane-api
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10005
        - AFFiNE:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10007
            description: Wiki & Notizen (lokal, mit Sync)
            icon: affine.png
            namespace: affine
            app: affine
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10007/api/health
        - Vaultwarden:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10006
            description: Passwort-Manager (Bitwarden-kompatibel)
            icon: mdi-shield-key-#175DDC
            namespace: vaultwarden
            app: vaultwarden
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10006/alive
        - Lern-PWA:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10000
            description: Fokus-Timer & Lernprojekte
            icon: si-pwa-#5a0fc8
        - Home Assistant:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10010
            description: Smart Home Steuerung
            icon: home-assistant.png
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10010
        - Open Claw:
            href: http://open-claw.tailddc8f7.ts.net:18789/#token={{HOMEPAGE_VAR_OPENCLAW_TOKEN}}
            description: OpenClaw Control (Oracle, via Tailscale)
            icon: oracle.png
            siteMonitor: http://open-claw.tailddc8f7.ts.net:18789

    - Infrastruktur:
        - ArgoCD:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/argocd
            description: GitOps Deployment Dashboard
            icon: argo-cd.png
            namespace: argocd
            app: argocd-server
        - Traefik:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/dashboard/
            description: Ingress Controller
            icon: traefik.png
            namespace: traefik
            app: traefik
        - Pi-hole:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10002/admin
            description: DNS & Ad-Blocking
            icon: pi-hole.png
        - cert-manager:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/argocd/applications/luna-sovereign-mesh-cert-manager
            description: TLS Zertifikate
            icon: cert-manager.png
            namespace: cert-manager
            app: cert-manager

    - Monitoring:
        - Beszel:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10008
            description: Server Monitoring (CPU, RAM, Disk, Temp)
            icon: beszel.png
            namespace: beszel
            app: beszel
            siteMonitor: https://raspberrypi-1.tailddc8f7.ts.net:10008/api/health
            widget:
              type: beszel
              url: http://beszel.beszel.svc.cluster.local:8090
              username: yourname@your-domain.de
              password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
              version: 2
              systemId: 2lk6992hxaywdvd
        - Grafana:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/grafana
            description: Monitoring Dashboards
            icon: grafana.png
            namespace: kube-prometheus-stack
            app: grafana
        - Prometheus:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/prometheus
            description: Metriken & Alerts
            icon: prometheus.png
            namespace: kube-prometheus-stack
            app: prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/prometheus
        - Alertmanager:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/alertmanager
            description: Alert Routing
            icon: alertmanager.png
            namespace: kube-prometheus-stack
            app: alertmanager
        - ntfy:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10003
            description: Alert-Push aufs Handy
            icon: ntfy.png
            namespace: ntfy
            app: ntfy
        - Kyverno Policy Reporter:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/policy-reporter
            description: Policy Dashboard
            icon: kyverno.png
            namespace: kyverno-policy-reporter
            app: policy-reporter-ui

  bookmarks:
    - Cluster:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/Guppy997/luna-sovereign-mesh
