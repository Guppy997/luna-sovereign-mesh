enableRbac: true

serviceAccount:
  name: homepage
  create: true

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: luna-sovereign-mesh-dev.luna.local
        paths:
          - path: /
            pathType: Prefix
      - host: raspberrypi-1.tailddc8f7.ts.net
        paths:
          - path: /
            pathType: Prefix

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "luna-sovereign-mesh-dev.luna.local,raspberrypi-1.tailddc8f7.ts.net,raspberrypi-1.tailddc8f7.ts.net:10001,192.168.178.117"

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs
  # Next.js braucht einen beschreibbaren Cache trotz read-only root-fs
  cache:
    enabled: true
    type: emptyDir
    mountPath: /app/.next/cache

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

config:
  settingsString: |
    title: Luna Sovereign Mesh
    headerStyle: boxed
    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 30
    cardBlur: sm
    theme: dark
    color: slate
    layout:
      Infrastruktur:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 4
      Self-Hosted:
        style: row
        columns: 4
      Server:
        style: row
        columns: 4

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "raspberry pi"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank

  kubernetes:
    mode: cluster

  services:
    - Infrastruktur:
        - ArgoCD:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/argocd
            description: GitOps Deployment Dashboard
            icon: argo-cd.png
            namespace: argocd
            app: argocd-server
        - Traefik:
            href: http://192.168.178.117/dashboard/
            description: Ingress Controller
            icon: traefik.png
            namespace: traefik
            app: traefik
        - Pi-hole:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10002/admin
            description: DNS & Ad-Blocking
            icon: pi-hole.png
        - cert-manager:
            href: http://192.168.178.117:30681/argocd/applications/luna-sovereign-mesh-cert-manager
            description: TLS Zertifikate
            icon: cert-manager.png
            namespace: cert-manager
            app: cert-manager

    - Monitoring:
        - Grafana:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/grafana
            description: Monitoring Dashboards
            icon: grafana.png
            namespace: kube-prometheus-stack
            app: grafana
        - Prometheus:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/prometheus
            description: Metriken & Alerts
            icon: prometheus.png
            namespace: kube-prometheus-stack
            app: prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/prometheus
        - Alertmanager:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/alertmanager
            description: Alert Routing
            icon: alertmanager.png
            namespace: kube-prometheus-stack
            app: alertmanager
        - ntfy:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10003
            description: Alert-Push aufs Handy
            icon: ntfy.png
            namespace: ntfy
            app: ntfy
        - Kyverno Policy Reporter:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10001/policy-reporter
            description: Policy Dashboard
            icon: kyverno.png
            namespace: kyverno-policy-reporter
            app: policy-reporter-ui

    - Self-Hosted:
        - Lern-PWA:
            href: https://raspberrypi-1.tailddc8f7.ts.net:10000
            description: Fokus-Timer & Lernprojekte
            icon: si-pwa-#5a0fc8

    - Server:
        - Open Claw:
            href: http://100.87.126.56:18789
            description: Oracle Cloud Server
            icon: oracle.png
            siteMonitor: http://100.87.126.56:18789

  bookmarks:
    - Cluster:
        - GitHub Repo:
            - abbr: GH
              href: https://github.com/Guppy997/luna-sovereign-mesh
