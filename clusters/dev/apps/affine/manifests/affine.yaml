apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: affine
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
spec:
  selector:
    app: affine
  ports:
    - port: 3010
      targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres.affine.svc.cluster.local 5432; do
                echo "Waiting for postgres..."; sleep 3
              done
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine-graphql:stable
          env:
            - name: NODE_OPTIONS
              value: "--import=./scripts/register.js"
            - name: NODE_ENV
              value: production
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: database-url
            - name: REDIS_SERVER_HOST
              value: redis.affine.svc.cluster.local
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: admin-email
            - name: AFFINE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: admin-password
          ports:
            - containerPort: 3010
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /root/.affine
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: tmp
          emptyDir: {}
