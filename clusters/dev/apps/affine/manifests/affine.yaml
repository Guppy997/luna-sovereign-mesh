apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: affine
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
spec:
  selector:
    app: affine
  ports:
    - port: 3010
      targetPort: 3010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
        # Homepage-Status-Widget sucht nach diesem Standard-Label
        app.kubernetes.io/name: affine
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres.affine.svc.cluster.local 5432; do echo "waiting for postgres..."; sleep 3; done
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
        - name: migrate
          image: ghcr.io/toeverything/affine:stable@sha256:d9d145f9f47b862d1fa96e2a887052b5762846237f75fbb077be990ef646e05c
          command: [node, ./scripts/self-host-predeploy.js]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: database-url
            - name: REDIS_SERVER_HOST
              value: redis.affine.svc.cluster.local
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: NODE_ENV
              value: production
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /root/.affine
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /root/.cache
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable@sha256:d9d145f9f47b862d1fa96e2a887052b5762846237f75fbb077be990ef646e05c
          env:
            - name: NODE_ENV
              value: production
            - name: AFFINE_CONFIG_PATH
              value: /root/.affine/config
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: database-url
            - name: REDIS_SERVER_HOST
              value: redis.affine.svc.cluster.local
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: AFFINE_SERVER_EXTERNAL_URL
              value: "https://raspberrypi-1.tailddc8f7.ts.net:10007"
            - name: AFFINE_SERVER_HTTPS
              value: "false"
            - name: AFFINE_INDEXER_ENABLED
              value: "false"
            - name: AFFINE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: admin-email
            - name: AFFINE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: admin-password
          ports:
            - containerPort: 3010
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /root/.affine
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /root/.cache
            # NestJS generiert das GraphQL-Schema zur Laufzeit nach /app/src
            - name: appsrc
              mountPath: /app/src
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: appsrc
          emptyDir: {}
