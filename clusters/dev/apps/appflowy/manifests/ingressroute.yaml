apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: appflowy-ws-transport
  namespace: appflowy
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 0   # kein Timeout für WS
    idleConnTimeout: 0          # kein Idle-Timeout
    dialTimeout: 30s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gotrue-stripprefix
  namespace: appflowy
spec:
  stripPrefix:
    prefixes:
      - /gotrue
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: appflowy
  namespace: appflowy
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && PathPrefix(`/gotrue`)
      kind: Rule
      priority: 200
      middlewares:
        - name: gotrue-stripprefix
          namespace: appflowy
      services:
        - name: gotrue
          port: 9999
          passHostHeader: false
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10005`) && PathPrefix(`/`)
      kind: Rule
      priority: 100
      services:
        - name: appflowy-cloud
          port: 8000
          passHostHeader: false
          serversTransport: appflowy-ws-transport
