apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gotrue-stripprefix
  namespace: appflowy
spec:
  stripPrefix:
    prefixes:
      - /gotrue
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: appflowy
  namespace: appflowy
spec:
  entryPoints:
    - webAppflowy
  routes:
    - match: PathPrefix(`/gotrue`)
      kind: Rule
      priority: 20
      middlewares:
        - name: gotrue-stripprefix
          namespace: appflowy
      services:
        - name: gotrue
          port: 9999
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: appflowy-cloud
          port: 8000
