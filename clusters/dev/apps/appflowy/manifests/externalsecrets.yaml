apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appflowy-secrets-es
  namespace: appflowy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: luna-sovereign-mesh-dev
  target:
    name: appflowy-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: appflowy-secrets
