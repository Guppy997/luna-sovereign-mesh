apiVersion: batch/v1
kind: Job
metadata:
  name: appflowy-enable-vector
  namespace: appflowy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command: [sh, -c, "until nc -z postgresql 5432; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: enable-vector
          image: pgvector/pgvector:0.8.2-pg16
          command:
            - sh
            - -c
            - |
              psql "postgres://postgres:$POSTGRES_PASSWORD@postgresql:5432/appflowy" \
                -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" && echo "Extensions OK"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: pg-password
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
