apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-worker
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appflowy-worker
  template:
    metadata:
      labels:
        app: appflowy-worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: appflowy-worker
          image: appflowyinc/appflowy_worker:0.16.0
          env:
            - name: RUST_LOG
              value: info
            - name: APPFLOWY_ENVIRONMENT
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: pg-password
            - name: APPFLOWY_WORKER_DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgresql:5432/appflowy
            - name: APPFLOWY_WORKER_DATABASE_NAME
              value: appflowy
            - name: APPFLOWY_WORKER_REDIS_URL
              value: redis://redis:6379
            - name: APPFLOWY_WORKER_IMPORT_TICK_INTERVAL
              value: "30"
            - name: APPFLOWY_S3_USE_MINIO
              value: "true"
            - name: APPFLOWY_S3_MINIO_URL
              value: http://minio:9000
            - name: APPFLOWY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: minio-access-key
            - name: APPFLOWY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: minio-secret-key
            - name: APPFLOWY_S3_BUCKET_NAME
              value: appflowy
            - name: APPFLOWY_S3_REGION
              value: us-east-1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
