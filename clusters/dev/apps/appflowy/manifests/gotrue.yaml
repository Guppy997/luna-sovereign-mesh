apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: appflowy
spec:
  selector:
    app: gotrue
  ports:
    - port: 9999
      targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotrue
          image: appflowyinc/gotrue:0.16.0
          env:
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgresql:5432/appflowy?search_path=auth
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: pg-password
            - name: API_EXTERNAL_URL
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue
            - name: GOTRUE_EXTERNAL_URL
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue
            - name: GOTRUE_SITE_URL
              value: appflowy-flutter://
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: jwt-secret
            - name: GOTRUE_JWT_EXP
              value: "7200"
            - name: GOTRUE_DB_POOL_SIZE
              value: "5"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "true"
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: GOTRUE_LOG_LEVEL
              value: info
            - name: GOTRUE_ADMIN_EMAIL
              value: yourname@your-domain.de
            - name: GOTRUE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: admin-password
            - name: GOTRUE_URI_ALLOW_LIST
              value: "*"
            - name: GOTRUE_MAILER_URLS_INVITE
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue/verify
            - name: GOTRUE_MAILER_URLS_CONFIRMATION
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue/verify
            - name: GOTRUE_MAILER_URLS_RECOVERY
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue/verify
            - name: GOTRUE_MAILER_URLS_EMAIL_CHANGE
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005/gotrue/verify
          ports:
            - containerPort: 9999
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
