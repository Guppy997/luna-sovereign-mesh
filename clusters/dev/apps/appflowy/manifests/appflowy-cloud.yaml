apiVersion: v1
kind: Service
metadata:
  name: appflowy-cloud
  namespace: appflowy
spec:
  selector:
    app: appflowy-cloud
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy-cloud
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appflowy-cloud
  template:
    metadata:
      labels:
        app: appflowy-cloud
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: appflowy-cloud
          image: appflowyinc/appflowy_cloud:0.16.0
          env:
            - name: RUST_LOG
              value: info
            - name: APPFLOWY_ENVIRONMENT
              value: production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: pg-password
            - name: APPFLOWY_DATABASE_URL
              value: postgres://postgres:$(POSTGRES_PASSWORD)@postgresql:5432/appflowy
            - name: APPFLOWY_WEB_URL
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005
            - name: APPFLOWY_REDIS_URI
              value: redis://redis:6379
            - name: APPFLOWY_GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: jwt-secret
            - name: APPFLOWY_GOTRUE_BASE_URL
              value: http://gotrue:9999
            - name: APPFLOWY_GOTRUE_EXT_URL
              value: https://raspberrypi-1.tailddc8f7.ts.net:10005
            - name: APPFLOWY_GOTRUE_ADMIN_EMAIL
              value: yourname@your-domain.de
            - name: APPFLOWY_GOTRUE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: admin-password
            - name: APPFLOWY_S3_USE_MINIO
              value: "true"
            - name: APPFLOWY_S3_MINIO_URL
              value: http://minio:9000
            - name: APPFLOWY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: minio-access-key
            - name: APPFLOWY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: minio-secret-key
            - name: APPFLOWY_S3_BUCKET_NAME
              value: appflowy
            - name: APPFLOWY_S3_REGION
              value: us-east-1
            - name: APPFLOWY_ACCESS_CONTROL
              value: "true"
            - name: APPFLOWY_GRPC_HOST
              value: 0.0.0.0
            - name: APPFLOWY_GRPC_PORT
              value: "50051"
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
