apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beszel
  namespace: beszel
spec:
  entryPoints:
    - web
  routes:
    - match: HeaderRegexp(`X-Forwarded-Host`, `.+:10008`)
      kind: Rule
      priority: 100
      services:
        - name: beszel
          port: 8090
          passHostHeader: false
